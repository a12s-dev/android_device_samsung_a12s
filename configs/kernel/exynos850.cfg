# Base DTB for the a12s boot image (consumed by vendor/lineage/build/tasks
# kernel.mk via BOARD_DTB_CFG; mkdtboimg cfg_create).
# exynos3830.dtb is the only DTB this kernel builds (arch/arm64/boot/dts/
# exynos/exynos3830.dts, dtb-y in dts/Makefile). Same entry as the official
# LineageOS a21s-common configs/kernel/exynos850.cfg (sister device, same SoC).
# NOTE: a previous revision referenced a non-existent "exynos3830-a12s.dtb";
# no such DTS exists in this tree, so mkdtboimg cfg_create failed with
# FileNotFoundError and the build died at 99%.
exynos3830.dtb
    custom0=0x00000000
    custom1=0xff000000
